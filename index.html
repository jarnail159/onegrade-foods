<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneGrade Foods - Pure Stone Ground Spices</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #fdfaf6; color: #333; }
    header { text-align: center; padding: 15px 0; border-bottom: 2px solid #b33927; }
    h1 { margin: 0; color: #b33927; font-size: 24px; }
    .tagline { font-size: 13px; color: #666; margin-top: 5px; }
    .card { background: #fff; padding: 16px; border-radius: 8px; margin: 15px auto; max-width: 480px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    label { font-weight: bold; font-size: 14px; display: block; margin-top: 10px; }
    select, input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
    .total-box { background: #fbeee8; padding: 12px; border-radius: 6px; text-align: center; margin: 15px 0; border: 1px solid #f2c7b5; }
    .total-price { font-size: 22px; font-weight: bold; color: #b33927; }
    .btn { background: #25d366; color: white; border: none; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: #1eb956; }
    .badge { background: #e8f5e9; color: #2e7d32; padding: 8px; border-radius: 5px; font-size: 13px; margin-bottom: 12px; text-align: center; font-weight: bold; border: 1px solid #c8e6c9; }
  </style>
</head>
<body>

  <header>
    <h1>OneGrade Foods</h1>
    <p class="tagline">Pure Stone Ground Spices | Bathinda & 50km Delivery</p>
  </header>

  <div class="card">
    <div class="badge">Free / Fast Doorstep Delivery in Bathinda & 50km radius</div>
    
    <label for="orderType">Order Type:</label>
    <select id="orderType" onchange="calculateTotal()">
      <option value="Retail">Retail (Ghar de lai)</option>
      <option value="Bulk">Bulk / Wholesale (Dukan / Hotel)</option>
    </select>

    <label for="product">Select Spice:</label>
    <select id="product" onchange="calculateTotal()">
      <option value="Haldi Powder" data-price="260">Haldi Powder - Rs 260/kg</option>
      <option value="Mirch Powder" data-price="320">Mirch Powder - Rs 320/kg</option>
      <option value="Dhaniya Powder" data-price="240">Dhaniya Powder - Rs 240/kg</option>
      <option value="Garam Masala" data-price="650">Garam Masala Special - Rs 650/kg</option>
    </select>

    <label for="qty">Quantity (in Kg):</label>
    <input type="number" id="qty" min="1" value="1" oninput="calculateTotal()" onchange="calculateTotal()">

    <div class="total-box">
      Kul Rakam: <span class="total-price" id="totalDisplay">Rs 260</span>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top: 0; color: #b33927;">Customer Details</h3>
    
    <label for="custName">Pura Naam:</label>
    <input type="text" id="custName" placeholder="Tuhada Naam">
    
    <label for="custPhone">Mobile Number:</label>
    <input type="tel" id="custPhone" placeholder="Mobile Number">
    
    <label for="custAddress">Pura Pata (Address):</label>
    <textarea id="custAddress" placeholder="Gali, Mohalla/Pind, Bathinda ya 50km da area" rows="3"></textarea>
    
    <button type="button" class="btn" onclick="sendOrder()">Order via WhatsApp</button>
  </div>

  <script>
    function calculateTotal() {
      var productSelect = document.getElementById('product');
      var selectedOption = productSelect.options[productSelect.selectedIndex];
      var pricePerKg = parseFloat(selectedOption.getAttribute('data-price')) || 0;
      var qtyInput = document.getElementById('qty').value;
      var qty = parseFloat(qtyInput) || 0;
      var orderType = document.getElementById('orderType').value;
      
      var total = pricePerKg * qty;
      
      // Bulk order 10kg ya zyada hone par 10% discount
      if (orderType === "Bulk" && qty >= 10) {
        total = total * 0.90;
      }
      
      total = Math.round(total);
      document.getElementById('totalDisplay').innerText = "Rs " + total;
      return total;
    }

    function sendOrder() {
      var name = document.getElementById('custName').value.trim();
      var phone = document.getElementById('custPhone').value.trim();
      var address = document.getElementById('custAddress').value.trim();
      var product = document.getElementById('product').value;
      var qty = document.getElementById('qty').value;
      var orderType = document.getElementById('orderType').value;
      var total = calculateTotal();

      if (!name || !phone || !address) {
        alert("Kripya karke Naam, Phone Number aur Address pura bharo!");
        return;
      }

      var businessNumber = "919115157413";
      
      var textMsg = "Nawa Order - OneGrade Foods\n" +
                    "----------------------------\n" +
                    "Gahak da Naam: " + name + "\n" +
                    "Phone: " + phone + "\n" +
                    "Pata: " + address + "\n" +
                    "Area: Bathinda & Surrounding 50km\n" +
                    "----------------------------\n" +
                    "Order Type: " + orderType + "\n" +
                    "Product: " + product + "\n" +
                    "Quantity: " + qty + " Kg\n" +
                    "Kul Rakam: Rs " + total + "\n" +
                    "----------------------------\n" +
                    "Payment Link (UPI): upi://pay?pa=9115157413@upi&pn=OneGradeFoods&am=" + total + "&cu=INR\n\n" +
                    "Order confirm karan lai eh message send karo.";

      var encodedMsg = encodeURIComponent(textMsg);
      var waUrl = "https://api.whatsapp.com/send?phone=" + businessNumber + "&text=" + encodedMsg;
      
      window.location.href = waUrl;
    }
  </script>

</body>
</html>
